<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF to Images Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4">Converted Images</h2>
    {% for path in image_paths %}
      <div class="mb-3">
        <img src="{{ path }}" class="img-fluid" alt="Converted Page">
      </div>
    {% endfor %}
    <a href="/" class="btn btn-primary mt-3">Back to Home</a>
  </div>
</body>
</html>
