<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Convert Images to PDF</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">
<div class="container">
  <h2 class="mb-4">Convert Images to PDF</h2>
  <form action="/images_to_pdf" method="post" enctype="multipart/form-data">
    <input type="file" name="image_files" accept="image/*" class="form-control mb-3" multiple required>
    <button type="submit" class="btn btn-success">Convert</button>
  </form>
</div>
</body>
</html>
