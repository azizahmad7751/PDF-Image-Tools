<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Convert PDF to Images</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">
<div class="container">
  <h2 class="mb-4">Convert PDF to Images</h2>
  <form action="/pdf_to_images" method="post" enctype="multipart/form-data">
    <input type="file" name="pdf_file" accept=".pdf" class="form-control mb-3" required>
    <button type="submit" class="btn btn-primary">Convert</button>
  </form>
</div>
</body>
</html>
