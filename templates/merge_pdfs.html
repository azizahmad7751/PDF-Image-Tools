<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merge PDF Files</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5 bg-light">
<div class="container">
  <h2 class="mb-4">Merge PDF Files</h2>
  <form action="/merge_pdfs" method="post" enctype="multipart/form-data">
    <input type="file" name="pdf_files" accept=".pdf" class="form-control mb-3" multiple required>
    <button type="submit" class="btn btn-warning">Merge</button>
  </form>
</div>
</body>
</html>
